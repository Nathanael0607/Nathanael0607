<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1000"
    height="300"
    viewBox="0 0 1000 300">

    <defs>

        <!-- Fundo -->
        <linearGradient id="space" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#020617"/>
            <stop offset="50%" stop-color="#090E2A"/>
            <stop offset="100%" stop-color="#000000"/>
        </linearGradient>

        <radialGradient id="nebulaPurple" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.45"/>
            <stop offset="50%" stop-color="#4C1D95" stop-opacity="0.20"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>

        <filter id="blurNebula">
            <feGaussianBlur stdDeviation="35"/>
        </filter>

        <!-- Gradiente da faixa central do disco -->
        <linearGradient id="beamGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#DC2626" stop-opacity="0"/>
            <stop offset="18%" stop-color="#F97316" stop-opacity="0.8"/>
            <stop offset="45%" stop-color="#FFF7CC"/>
            <stop offset="55%" stop-color="#FFFFFF"/>
            <stop offset="82%" stop-color="#F97316" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#DC2626" stop-opacity="0"/>
        </linearGradient>

        <!-- Brilho do disco -->
        <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="5" result="blur"/>
            <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Gradiente radial de brilho do disco -->
        <radialGradient id="eventGlow" cx="50%" cy="50%" r="50%">
            <stop offset="55%" stop-color="#000000"/>
            <stop offset="72%" stop-color="#F97316" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
        </radialGradient>

    </defs>

    <rect
        width="1000"
        height="300"
        fill="url(#space)"/>

        <!-- Nebulosa -->
    <ellipse
        cx="280"
        cy="130"
        rx="220"
        ry="90"
        fill="url(#nebulaPurple)"
        filter="url(#blurNebula)"
    />

    <ellipse
        cx="650"
        cy="180"
        rx="260"
        ry="100"
        fill="url(#nebulaPurple)"
        filter="url(#blurNebula)"
        opacity="0.6"
    />

        <!-- Estrelas pequenas -->
    <circle cx="80" cy="60" r="1.2" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="170" cy="40" r="1" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="230" cy="210" r="1.4" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="350" cy="70" r="1" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="430" cy="240" r="1.3" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="560" cy="55" r="1.1" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="690" cy="80" r="1.4" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="780" cy="230" r="1" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="870" cy="90" r="1.3" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="930" cy="200" r="1.1" fill="#FFFFFF" opacity="0.7"/>

    <!-- Estrelas animadas -->
    <circle cx="120" cy="150" r="2" fill="#FFFFFF">
        <animate
            attributeName="opacity"
            values="0.2;1;0.2"
            dur="3s"
            repeatCount="indefinite"
        />
    </circle>

    <circle cx="500" cy="40" r="2.3" fill="#FFFFFF">
        <animate
            attributeName="opacity"
            values="0.3;1;0.3"
            dur="4s"
            repeatCount="indefinite"
        />
    </circle>

    <circle cx="820" cy="140" r="2" fill="#FFFFFF">
        <animate
            attributeName="opacity"
            values="0.2;0.9;0.2"
            dur="2.5s"
            repeatCount="indefinite"
        />
    </circle>

    <!-- Brilho externo pulsante do buraco negro -->
    <!-- ================================= -->
    <!-- BURACO NEGRO                     -->
    <!-- ================================= -->

    <g id="black-hole">

        <!-- Aura geral -->
        <ellipse
            cx="500"
            cy="150"
            rx="145"
            ry="55"
            fill="url(#accretionGlow)"
            opacity="0.55"
        />

        <!-- Disco traseiro externo -->
        <ellipse
            cx="500"
            cy="150"
            rx="125"
            ry="31"
            fill="none"
            stroke="url(#accretionGradient)"
            stroke-width="13"
            opacity="0.28"
            filter="url(#strongGlow)"
        />

        <!-- Disco traseiro principal -->
        <ellipse
            cx="500"
            cy="150"
            rx="118"
            ry="27"
            fill="none"
            stroke="url(#accretionGradient)"
            stroke-width="7"
            opacity="0.9"
        />

        <!-- Curvatura superior da luz -->
        <path
            d="M 440 150
            C 443 103, 557 103, 560 150"
            fill="none"
            stroke="#FDBA74"
            stroke-width="8"
            stroke-linecap="round"
            opacity="0.75"
            filter="url(#strongGlow)"
        />

        <!-- Linha quente superior -->
        <path
            d="M 445 150
            C 448 111, 552 111, 555 150"
            fill="none"
            stroke="#FFF7CC"
            stroke-width="3"
            stroke-linecap="round"
            opacity="0.9"
        />

        <!-- Curvatura inferior da luz -->
        <path
            d="M 440 150
            C 443 197, 557 197, 560 150"
            fill="none"
            stroke="#F97316"
            stroke-width="7"
            stroke-linecap="round"
            opacity="0.65"
            filter="url(#strongGlow)"
        />

        <!-- Linha quente inferior -->
        <path
            d="M 446 150
            C 450 189, 550 189, 554 150"
            fill="none"
            stroke="#FDBA74"
            stroke-width="3"
            stroke-linecap="round"
            opacity="0.75"
        />

        <!-- Brilho ao redor do horizonte -->
        <circle
            cx="500"
            cy="150"
            r="59"
            fill="url(#eventGlow)"
        />

        <!-- Horizonte de eventos -->
        <circle
            cx="500"
            cy="150"
            r="44"
            fill="#000000"
        />

        <!-- Contorno luminoso do horizonte -->
        <circle
            cx="500"
            cy="150"
            r="47"
            fill="none"
            stroke="#FDBA74"
            stroke-width="2"
            opacity="0.75"
            filter="url(#strongGlow)"
        />

        <!-- Faixa luminosa que passa na frente -->
        <path
            d="M 365 150
            C 420 146, 580 154, 635 150"
            fill="none"
            stroke="url(#beamGradient)"
            stroke-width="9"
            stroke-linecap="round"
            filter="url(#strongGlow)"
        />

        <!-- Núcleo branco da faixa -->
        <path
            d="M 375 150
            C 430 148, 570 152, 625 150"
            fill="none"
            stroke="#FFF7CC"
            stroke-width="2.5"
            stroke-linecap="round"
            opacity="0.95"
        />

    </g>

    <!-- Aura luminosa do disco de acreção -->
    <ellipse
        cx="500"
        cy="150"
        rx="135"
        ry="45"
        fill="url(#eventGlow)"
        opacity="0.7"
    />

    <!-- Disco de acreção -->
    <!-- Brilho externo do disco -->
    <ellipse
        cx="500"
        cy="150"
        rx="112"
        ry="32"
        fill="none"
        stroke="url(#accretionGradient)"
        stroke-width="14"
        opacity="0.25"
        filter="url(#strongGlow)"
    />

    <!-- Disco principal -->
    <ellipse
        cx="500"
        cy="150"
        rx="105"
        ry="28"
        fill="none"
        stroke="url(#accretionGradient)"
        stroke-width="8"
        opacity="0.95"
    />

    <!-- Linha interna mais quente -->
    <ellipse
        cx="500"
        cy="150"
        rx="92"
        ry="22"
        fill="none"
        stroke="#FFF7CC"
        stroke-width="3"
        opacity="0.65"
    />

    <!-- Arco brilhante esquerdo animado -->
    <ellipse
        cx="500"
        cy="150"
        rx="105"
        ry="28"
        fill="none"
        stroke="#FFF7CC"
        stroke-width="5"
        stroke-linecap="round"
        stroke-dasharray="90 570"
        opacity="0.9">

        <animate
            attributeName="stroke-dashoffset"
            values="20;-640"
            dur="8s"
            repeatCount="indefinite"
        />

    </ellipse>

    <!-- Arco brilhante direito animado -->
    <ellipse
        cx="500"
        cy="150"
        rx="105"
        ry="28"
        fill="none"
        stroke="#FDBA74"
        stroke-width="4"
        stroke-linecap="round"
        stroke-dasharray="65 595"
        opacity="0.75">

        <animate
            attributeName="stroke-dashoffset"
            values="-160;-820"
            dur="11s"
            repeatCount="indefinite"
        />

    </ellipse>

    <!-- Horizonte de eventos -->
    <circle
        cx="500"
        cy="150"
        r="48"
        fill="#000000"
    />

    <!-- Sombra interna -->
    <circle
        cx="500"
        cy="150"
        r="36"
        fill="#020617"
    />

</svg>