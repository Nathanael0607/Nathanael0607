<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1000"
    height="300"
    viewBox="0 0 1000 300">

    <defs>

        <!-- Fundo -->
        <linearGradient id="space" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#020617"/>
            <stop offset="50%" stop-color="#090E2A"/>
            <stop offset="100%" stop-color="#000000"/>
        </linearGradient>

        <radialGradient id="nebulaPurple" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.45"/>
            <stop offset="50%" stop-color="#4C1D95" stop-opacity="0.20"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>

        <filter id="blurNebula">
            <feGaussianBlur stdDeviation="35"/>
        </filter>

        <!-- Gradiente do disco de acreção -->
        <linearGradient id="accretionGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#F97316"/>
            <stop offset="50%" stop-color="#FDE68A"/>
            <stop offset="100%" stop-color="#DC2626"/>
        </linearGradient>

        <!-- Brilho do disco -->
        <filter id="glowAccretion">
            <feGaussianBlur stdDeviation="6" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

    </defs>

    <rect
        width="1000"
        height="300"
        fill="url(#space)"/>

        <!-- Nebulosa -->
    <ellipse
        cx="280"
        cy="130"
        rx="220"
        ry="90"
        fill="url(#nebulaPurple)"
        filter="url(#blurNebula)"
    />

    <ellipse
        cx="650"
        cy="180"
        rx="260"
        ry="100"
        fill="url(#nebulaPurple)"
        filter="url(#blurNebula)"
        opacity="0.6"
    />

        <!-- Estrelas pequenas -->
    <circle cx="80" cy="60" r="1.2" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="170" cy="40" r="1" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="230" cy="210" r="1.4" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="350" cy="70" r="1" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="430" cy="240" r="1.3" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="560" cy="55" r="1.1" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="690" cy="80" r="1.4" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="780" cy="230" r="1" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="870" cy="90" r="1.3" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="930" cy="200" r="1.1" fill="#FFFFFF" opacity="0.7"/>

    <!-- Estrelas animadas -->
    <circle cx="120" cy="150" r="2" fill="#FFFFFF">
        <animate
            attributeName="opacity"
            values="0.2;1;0.2"
            dur="3s"
            repeatCount="indefinite"
        />
    </circle>

    <circle cx="500" cy="40" r="2.3" fill="#FFFFFF">
        <animate
            attributeName="opacity"
            values="0.3;1;0.3"
            dur="4s"
            repeatCount="indefinite"
        />
    </circle>

    <circle cx="820" cy="140" r="2" fill="#FFFFFF">
        <animate
            attributeName="opacity"
            values="0.2;0.9;0.2"
            dur="2.5s"
            repeatCount="indefinite"
        />
    </circle>

    <!--Brilho externo do buraco negro-->
    <circle 
        cx="500"
        cy="150"
        r="2"
        fill="#7C3AED"
        opacity="0.10"
        />

    <!-- Disco de acreção -->
    <!-- Brilho externo do disco -->
    <ellipse
        cx="500"
        cy="150"
        rx="112"
        ry="32"
        fill="none"
        stroke="url(#accretionGradient)"
        stroke-width="14"
        opacity="0.25"
        filter="url(#glowAccretion)"
    />

    <!-- Disco principal -->
    <ellipse
        cx="500"
        cy="150"
        rx="105"
        ry="28"
        fill="none"
        stroke="url(#accretionGradient)"
        stroke-width="8"
        opacity="0.95"
    />

    <!-- Linha interna mais quente -->
    <ellipse
        cx="500"
        cy="150"
        rx="92"
        ry="22"
        fill="none"
        stroke="#FFF7CC"
        stroke-width="3"
        opacity="0.65"
    />

    <!-- Arco brilhante esquerdo animado -->
    <ellipse
        cx="500"
        cy="150"
        rx="105"
        ry="28"
        fill="none"
        stroke="#FFF7CC"
        stroke-width="5"
        stroke-linecap="round"
        stroke-dasharray="90 570"
        opacity="0.9">

        <animate
            attributeName="stroke-dashoffset"
            values="20;-640"
            dur="8s"
            repeatCount="indefinite"
        />

    </ellipse>

    <!-- Arco brilhante direito animado -->
    <ellipse
        cx="500"
        cy="150"
        rx="105"
        ry="28"
        fill="none"
        stroke="#FDBA74"
        stroke-width="4"
        stroke-linecap="round"
        stroke-dasharray="65 595"
        opacity="0.75">

        <animate
            attributeName="stroke-dashoffset"
            values="-160;-820"
            dur="11s"
            repeatCount="indefinite"
        />

    </ellipse>

    <!-- Horizonte de eventos -->
    <circle
        cx="500"
        cy="150"
        r="48"
        fill="#000000"
    />

    <!-- Sombra interna -->
    <circle
        cx="500"
        cy="150"
        r="36"
        fill="#020617"
    />

</svg>