<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1000"
    height="300"
    viewBox="0 0 1000 300">

    <defs>

        <!-- Recorte da parte frontal do disco -->
        <clipPath id="frontDiskClip">
            <rect
                x="340"
                y="144"
                width="320"
                height="12"
            />
        </clipPath>

        <!-- Fundo -->
        <linearGradient id="space" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#020617"/>
            <stop offset="50%" stop-color="#090E2A"/>
            <stop offset="100%" stop-color="#000000"/>
        </linearGradient>

        <radialGradient id="nebulaPurple" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.45"/>
            <stop offset="50%" stop-color="#4C1D95" stop-opacity="0.20"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>

        <filter id="blurNebula">
            <feGaussianBlur stdDeviation="35"/>
        </filter>

        <!-- Gradiente principal do disco de acreção -->
        <linearGradient
            id="accretionGradient"
            x1="0%"
            y1="0%"
            x2="100%"
            y2="0%">

            <stop
                offset="0%"
                stop-color="#DC2626"
            />

            <stop
                offset="25%"
                stop-color="#F97316"
            />

            <stop
                offset="50%"
                stop-color="#FFF7CC"
            />

            <stop
                offset="75%"
                stop-color="#F97316"
            />

            <stop
                offset="100%"
                stop-color="#DC2626"
            />

        </linearGradient>


        <!-- Aura do disco de acreção -->
        <radialGradient
            id="accretionGlow"
            cx="50%"
            cy="50%"
            r="50%">

            <stop
                offset="0%"
                stop-color="#FDE68A"
                stop-opacity="0.35"
            />

            <stop
                offset="45%"
                stop-color="#F97316"
                stop-opacity="0.20"
            />

            <stop
                offset="100%"
                stop-color="#DC2626"
                stop-opacity="0"
            />

        </radialGradient>
        <linearGradient id="beamGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#DC2626" stop-opacity="0"/>
            <stop offset="18%" stop-color="#F97316" stop-opacity="0.8"/>
            <stop offset="45%" stop-color="#FFF7CC"/>
            <stop offset="55%" stop-color="#FFFFFF"/>
            <stop offset="82%" stop-color="#F97316" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#DC2626" stop-opacity="0"/>
        </linearGradient>

        <!-- Brilho do disco -->
        <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="5" result="blur"/>
            <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Gradiente radial de brilho do disco -->
        <radialGradient id="eventGlow" cx="50%" cy="50%" r="50%">
            <stop offset="55%" stop-color="#000000"/>
            <stop offset="72%" stop-color="#F97316" stop-opacity="0.45"/>
            <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
        </radialGradient>

    </defs>

    <rect
        width="1000"
        height="300"
        fill="url(#space)"/>

        <!-- Nebulosa -->
    <ellipse
        cx="280"
        cy="130"
        rx="220"
        ry="90"
        fill="url(#nebulaPurple)"
        filter="url(#blurNebula)"
    />

    <ellipse
        cx="650"
        cy="180"
        rx="260"
        ry="100"
        fill="url(#nebulaPurple)"
        filter="url(#blurNebula)"
        opacity="0.6"
    />

        <!-- Estrelas pequenas -->
    <circle cx="80" cy="60" r="1.2" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="170" cy="40" r="1" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="230" cy="210" r="1.4" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="350" cy="70" r="1" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="430" cy="240" r="1.3" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="560" cy="55" r="1.1" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="690" cy="80" r="1.4" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="780" cy="230" r="1" fill="#FFFFFF" opacity="0.6"/>
    <circle cx="870" cy="90" r="1.3" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="930" cy="200" r="1.1" fill="#FFFFFF" opacity="0.7"/>

    <!-- Estrelas animadas -->
    <circle cx="120" cy="150" r="2" fill="#FFFFFF">
        <animate
            attributeName="opacity"
            values="0.2;1;0.2"
            dur="3s"
            repeatCount="indefinite"
        />
    </circle>

    <circle cx="500" cy="40" r="2.3" fill="#FFFFFF">
        <animate
            attributeName="opacity"
            values="0.3;1;0.3"
            dur="4s"
            repeatCount="indefinite"
        />
    </circle>

    <circle cx="820" cy="140" r="2" fill="#FFFFFF">
        <animate
            attributeName="opacity"
            values="0.2;0.9;0.2"
            dur="2.5s"
            repeatCount="indefinite"
        />
    </circle>


    <!-- Brilho externo pulsante do buraco negro -->
    <!-- ================================= -->
    <!-- BURACO NEGRO                     -->
    <!-- ================================= -->

    <g id="black-hole">

    <!-- 1. Aura externa -->
    <ellipse
        cx="500"
        cy="150"
        rx="145"
        ry="55"
        fill="url(#accretionGlow)"
        opacity="0.55"
    />

    <!-- ================================= -->
    <!-- ANEL ÚNICO DO DISCO DE ACREÇÃO   -->
    <!-- ================================= -->

    <!-- Estrutura traseira do anel -->
    <path
        id="accretionRing"
        pathLength="1000"
        d="
            M 365 150

            C 390 149, 420 145, 440 135
            C 452 116, 472 108, 500 108
            C 528 108, 548 116, 560 135
            C 580 145, 610 149, 640 150

            C 615 155, 585 156, 555 154
            C 535 153, 515 152, 500 152
            C 485 152, 465 153, 445 154
            C 415 156, 385 155, 360 150

            Z
        "
        fill="none"
        stroke="url(#accretionGradient)"
        stroke-width="9"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.9"
    />

    <!-- Brilho difuso traseiro -->
    <use
        href="#accretionRing"
        fill="none"
        stroke="#F97316"
        stroke-width="18"
        opacity="0.22"
        filter="url(#strongGlow)"
    />

    <!-- ================================= -->
    <!-- PLASMA TRASEIRO                   -->
    <!-- ================================= -->

    <!-- Halo branco do plasma traseiro -->
    <path
        pathLength="1000"
        d="
            M 365 150
            C 390 149, 420 145, 440 135
            C 452 116, 472 108, 500 108
            C 528 108, 548 116, 560 135
            C 580 145, 610 149, 640 150
        "
        fill="none"
        stroke="#FFFFFF"
        stroke-width="12"
        stroke-linecap="round"
        stroke-dasharray="140 860"
        opacity="0.45"
        filter="url(#strongGlow)">

        <animate
            attributeName="stroke-dashoffset"
            from="0"
            to="-1000"
            dur="7s"
            begin="-3.5s"
            repeatCount="indefinite"
        />

    </path>

    <!-- Núcleo branco do plasma traseiro -->
    <path
        pathLength="1000"
        d="
            M 365 150
            C 390 149, 420 145, 440 135
            C 452 116, 472 108, 500 108
            C 528 108, 548 116, 560 135
            C 580 145, 610 149, 640 150
        "
        fill="none"
        stroke="#FFFFFF"
        stroke-width="4"
        stroke-linecap="round"
        stroke-dasharray="140 860"
        opacity="1">

        <animate
            attributeName="stroke-dashoffset"
            from="0"
            to="-1000"
            dur="7s"
            begin="-3.5s"
            repeatCount="indefinite"
        />

    </path>

    <!-- Núcleo branco do plasma traseiro -->
    <path
        pathLength="1000"
        d="
            M 365 150
            C 390 149, 420 145, 440 135
            C 452 116, 472 108, 500 108
            C 528 108, 548 116, 560 135
            C 580 145, 610 149, 640 150
        "
        fill="none"
        stroke="#FFFFFF"
        stroke-width="4"
        stroke-linecap="round"
        stroke-dasharray="140 860"
        opacity="1">

        <animate
            attributeName="stroke-dashoffset"
            from="0"
            to="-1000"
            dur="7s"
            begin="-3.5s"
            repeatCount="indefinite"
        />

    </path>
        
    <!-- ============================== -->
    <!-- LENTE GRAVITACIONAL TRASEIRA  -->
    <!-- ============================== -->

    <!-- Arco superior externo -->
    <path
        d="M 440 150
           C 442 100, 558 100, 560 150"
        fill="none"
        stroke="#F97316"
        stroke-width="10"
        stroke-linecap="round"
        opacity="0.55"
        filter="url(#strongGlow)"
    />

    <!-- Arco superior quente -->
    <path
        d="M 445 150
           C 447 108, 553 108, 555 150"
        fill="none"
        stroke="#FFF7CC"
        stroke-width="3"
        stroke-linecap="round"
        opacity="0.95"
    />

    <!-- ============================== -->
    <!-- HORIZONTE DE EVENTOS          -->
    <!-- ============================== -->

    <!-- Região preta -->
    <circle
        cx="500"
        cy="150"
        r="46"
        fill="#000000"
    />

    <!-- Borda quente externa -->
    <circle
        cx="500"
        cy="150"
        r="47"
        fill="none"
        stroke="#F97316"
        stroke-width="2"
        opacity="0.85"
        filter="url(#strongGlow)"
    />


    <!-- ============================== -->
    <!-- CONTORNOS INTERNOS            -->
    <!-- ============================== -->

    <!-- Contorno interno superior -->
    <path
        d="M 468 137
           C 476 116, 524 116, 532 137"
        fill="none"
        stroke="#FDBA74"
        stroke-width="2.2"
        stroke-linecap="round"
        opacity="0.95"
    />

    <!-- Segundo brilho superior -->
    <path
        d="M 473 135
           C 480 122, 520 122, 527 135"
        fill="none"
        stroke="#FFF7CC"
        stroke-width="1"
        stroke-linecap="round"
        opacity="0.75"
    />

    <!-- Contorno interno inferior -->
    <path
        d="M 468 163
           C 476 184, 524 184, 532 163"
        fill="none"
        stroke="#F97316"
        stroke-width="2.2"
        stroke-linecap="round"
        opacity="0.90"
    />

    <!-- Segundo brilho inferior -->
    <path
        d="M 473 165
           C 480 178, 520 178, 527 165"
        fill="none"
        stroke="#FDBA74"
        stroke-width="1"
        stroke-linecap="round"
        opacity="0.70"
    />

    <!-- Terceiro contorno inferior -->
    <path
        d="
            M 463 160
            C 468 198, 532 198, 537 160
        "
        fill="none"
        stroke="#F97316"
        stroke-width="2.9"
        stroke-linecap="round"
        opacity="0.75"
    />

    <!-- Quarto contorno inferior -->
    <path
        d="
            M 462 161
            C 470 206, 540 198, 537 158
        "
        fill="none"
        stroke="#F97316"
        stroke-width="4"
        stroke-linecap="round"
        opacity="0.55"
        filter="url(#strongGlow)"
    />

    <!-- ================================= -->
    <!-- PARTE FRONTAL DO MESMO ANEL      -->
    <!-- ================================= -->

    <!-- Disco frontal -->
    <use
        href="#accretionRing"
        clip-path="url(#frontDiskClip)"
        fill="none"
        stroke="url(#beamGradient)"
        stroke-width="9"
        stroke-linecap="round"
        opacity="1"
        filter="url(#strongGlow)"
    />

    <!-- Centro quente do disco frontal -->
    <use
        href="#accretionRing"
        clip-path="url(#frontDiskClip)"
        fill="none"
        stroke="#FFF7CC"
        stroke-width="4"
        stroke-linecap="round"
        opacity="0.95"/>

    <!-- ================================= -->
    <!-- PLASMA BRANCO FRONTAL             -->
    <!-- ================================= -->

    <!-- Halo branco do plasma frontal -->
    <path
        pathLength="1000"
        d="
            M 360 150
            C 405 158, 455 157, 500 154
            C 545 157, 595 158, 640 150
        "
        fill="none"
        stroke="#FFFFFF"
        stroke-width="12"
        stroke-linecap="round"
        stroke-dasharray="120 880"
        stroke-dashoffset="0"
        opacity="0.45"
        filter="url(#strongGlow)">

        <animate
            attributeName="stroke-dashoffset"
            from="0"
            to="-1000"
            dur="5s"
            repeatCount="indefinite"
        />

    </path>

    <!-- Núcleo branco do plasma frontal -->
    <path
        pathLength="1000"
        d="
            M 360 150
            C 405 158, 455 157, 500 154
            C 545 157, 595 158, 640 150
        "
        fill="none"
        stroke="#FFFFFF"
        stroke-width="5"
        stroke-linecap="round"
        stroke-dasharray="120 880"
        stroke-dashoffset="0"
        opacity="1">

        <animate
            attributeName="stroke-dashoffset"
            from="0"
            to="-1000"
            dur="5s"
            repeatCount="indefinite"
        />

    </path>
    </g>

    <!-- ================================= -->
    <!-- NAVE ESPACIAL                     -->
    <!-- ================================= -->

    <g id="spaceship">

        <!-- Corpo principal da nave -->
    <path
        d="
            M 100 225

            C 110 214, 125 208, 145 210
            C 158 212, 170 218, 180 225

            C 170 232, 158 238, 145 240
            C 125 242, 110 236, 100 225

            Z
        "
        fill="#E5E7EB"
        stroke="#FFFFFF"
        stroke-width="1.5"
    />

    <!-- Cabine -->
    <path
        d="
            M 130 212
            C 138 204, 151 204, 158 214
            C 148 212, 139 211, 130 212
            Z
        "
        fill="#60A5FA"
        stroke="#BFDBFE"
        stroke-width="1"
    />

    <!-- Asa superior -->
    <path
        d="
            M 135 218
            L 115 202
            L 145 217
            Z
        "
        fill="#CBD5E1"
        stroke="#FFFFFF"
        stroke-width="1"
    />

    <!-- Asa inferior -->
    <path
        d="
            M 135 232
            L 115 248
            L 145 233
            Z
        "
        fill="#94A3B8"
        stroke="#FFFFFF"
        stroke-width="1"
    />

    <!-- Motor traseiro -->
    <path
        d="
            M 105 220
            L 94 222
            L 94 228
            L 105 230
            Z
        "
        fill="#64748B"
        stroke="#CBD5E1"
        stroke-width="1"
    />

    <!-- Propulsão -->
    <path
        d="
            M 95 222
            C 82 223, 75 225, 68 225
            C 75 227, 82 228, 95 228
            Z
        "
        fill="#60A5FA"
        opacity="0.85"
    />

    <!-- Núcleo da propulsão -->
    <path
        d="
            M 95 223
            C 84 224, 78 225, 73 225
            C 78 226, 84 227, 95 227
            Z
        "
        fill="#FFFFFF"
        opacity="0.9"
    >
        <animate
            attributeName="opacity"
            values="0.5;1;0.5"
            dur="0.8s"
            repeatCount="indefinite"
        />
    </path>

    <!-- Movimento da nave pelo espaço -->
    <animateTransform
        attributeName="transform"
        type="translate"
        from="-220 0"
        to="1050 0"
        dur="12s"
        repeatCount="indefinite"
    />

    </g>

</svg>