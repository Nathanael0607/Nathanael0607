
name: Gerar estatísticas do GitHub

on:
  workflow_dispatch:

jobs:
  gerar-estatisticas:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v6

      - name: Gerar estatísticas gerais
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Nathanael0607&show_icons=true&theme=tokyonight&locale=pt-br
          path: assets/svg/github-stats.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Gerar linguagens mais utilizadas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Nathanael0607&layout=compact&theme=tokyonight&locale=pt-br
          path: assets/svg/github-top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}
          fail_on_error: true

      - name: Salvar estatísticas no repositório
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: atualiza estatísticas do GitHub"
          file_pattern: assets/svg/github-stats.svg assets/svg/github-top-langs.svg
